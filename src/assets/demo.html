<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Booking Widget Demo</title>
  <style>
    body {
      margin: 0;
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f0eb;
      color: #1a1a1a;
    }
    .demo {
      max-width: 480px;
      margin: 0 auto;
      padding: 48px 16px;
    }
    .demo h1 {
      font-size: 24px;
      margin: 0 0 8px;
    }
    .demo p {
      font-size: 14px;
      color: #6b6b6b;
      margin: 0 0 24px;
    }
    .demo code {
      background: #e8e1d8;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <main class="demo">
    <h1>Booking Widget Demo</h1>
    <p>
      Embedding the booking widget for restaurant
      <code id="slug"></code>.
    </p>
    <div id="widget-host"></div>
  </main>

  <script type="module" src="/widget/booking-widget.mjs"></script>
  <script type="module">
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug') || '';

    const slugEl = document.getElementById('slug');
    if (slugEl) {
      slugEl.textContent = slug || 'unknown';
    }

    const host = document.getElementById('widget-host');
    if (slug && host) {
      const widget = document.createElement('booking-widget');
      widget.setAttribute('restaurant', slug);
      host.appendChild(widget);
    }
  </script>
</body>
</html>
