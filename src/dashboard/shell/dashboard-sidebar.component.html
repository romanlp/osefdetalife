<nav data-testid="sidebar-nav" class="sidebar" aria-label="Dashboard navigation">
  <p class="brand">Osefdetalife</p>
  <ul class="nav-list">
    @for (item of navItems; track item.label) {
      <li>
        <a
          class="nav-link"
          [attr.data-testid]="'nav-item-' + item.label.toLowerCase()"
          [routerLink]="item.path"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <mat-icon aria-hidden="true">{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
